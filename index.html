<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b0906" />
    <meta
      name="description"
      content="蔣貢康楚仁波切唱诵 · सप्तपङ्क्तिप्रार्थना"
    />
    <title>सप्तपङ्क्तिप्रार्थना</title>
    <link rel="stylesheet" href="/resonance.css" />
  </head>
  <body>
    <main
      id="resonanceStage"
      class="resonance-stage"
      data-original-artwork="false"
    >
      <canvas
        id="resonanceCanvas"
        class="resonance-canvas"
        aria-hidden="true"
      ></canvas>

      <img
        id="resonanceArtwork"
        class="resonance-accessible-art"
        src="/guru-rinpoche-1920x2400-v1.jpg"
        alt="莲花生大士独尊唐卡"
        width="6391"
        height="8940"
        data-original-resolution="false"
      />

      <header class="resonance-heading">
        <span lang="sa">गुरु पद्मसम्भव</span>
        <h1 lang="sa">सप्तपङ्क्तिप्रार्थना</h1>
        <p>蔣貢康楚仁波切唱诵</p>
      </header>

      <button
        id="resonanceListen"
        type="button"
        class="resonance-listen"
        aria-label="聆听唱诵"
        aria-pressed="false"
      >
        <span id="resonanceListenLabel" class="resonance-listen-label">
          聆听
        </span>
        <span id="resonanceListenTime" class="resonance-listen-time">
          00:00 / 07:52
        </span>
      </button>

      <div class="resonance-progress" aria-hidden="true">
        <span id="resonanceProgress"></span>
      </div>

      <div class="resonance-instruction" aria-hidden="true">
        <span>MOVE TO RESONATE</span>
        <i></i>
      </div>

      <audio
        id="resonanceAudio"
        src="/audio.mp3"
        preload="metadata"
      ></audio>

      <noscript>请启用 JavaScript 以体验互动光场与唱诵。</noscript>
    </main>
    <script src="/resonance.js" defer></script>
  </body>
</html>
